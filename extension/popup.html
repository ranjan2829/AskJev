<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AskJev</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="w-popup">
  <div class="p-2.5">
    <div class="mb-2 flex items-center gap-2.5">
      <div class="grid h-7 w-7 shrink-0 place-items-center rounded-md border border-zinc-800 bg-zinc-900" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 2.5L17 8.2L14.6 9.4L10 12.2L5.4 9.4L3 8.2L10 2.5Z" fill="#FAFAFA"/>
          <path d="M10 7.2L14.2 9.1L10 11.2L5.8 9.1L10 7.2Z" fill="#18181B"/>
          <rect x="6.5" y="14.2" width="7" height="1.4" fill="#A1A1AA"/>
        </svg>
      </div>
      <div class="min-w-0 flex-1">
        <h1 class="m-0 text-sm font-semibold tracking-tight">AskJev</h1>
      </div>
      <button class="switch" id="en" type="button" aria-label="Toggle AskJev" aria-pressed="true"></button>
    </div>

    <!-- single readiness sentence — the only status surface in the popup -->
    <div class="mb-2 flex items-start rounded-xl border border-zinc-800 bg-zinc-900 px-2.5 py-2" role="status" aria-live="polite">
      <span class="dot mt-[5px] shrink-0" id="stateDot"></span>
      <p class="m-0 min-w-0 flex-1 text-[11px] leading-snug text-zinc-300" id="stateText">Checking…</p>
    </div>

    <div class="grid gap-1.5">
      <button class="aj-btn" id="auto" type="button">Open Autopilot</button>
      <button class="aj-btn" id="opts" type="button">Settings</button>
    </div>

    <div class="mt-2 flex items-center justify-between text-[11px] text-zinc-500">
      <span id="ver">v1.7.3</span>
      <button type="button" id="docs" class="bg-transparent p-0 text-[11px] text-zinc-400 hover:text-zinc-50">Bridge help</button>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
